# Default-deny egress proxy for the Codex check container.
# The filter file lists the ONLY hosts that may be reached; anything else is
# refused with a 403. CONNECT is allowed to port 443 only. Every request is
# logged with its host (Info level) to stdout.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Info
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
ConnectPort 443
